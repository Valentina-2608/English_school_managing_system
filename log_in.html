<!DOCTYPE HTML>
<html>
<head>
	<title>Log In</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="css/style.css">
	
</head>
<body>
    <div class="main2">
        <div class="container3">
            <div class="container4">
                <div class="container4_caption">Log in to managing system</div>
                <div class="container4_form">
                    <form id="form_login">
                        <div class="form_elem">
               			    <label for="user_email">Email</label><br>
                		    <input type="email" placeholder="Enter your email" name="password" id="user_email" required autocomplete="on"><br>
            		    </div>

					    <div class="form_elem">
               			    <label for="user_password">Password</label><br>
                		    <input type="password" placeholder="Enter password" name="password" id="user_password" required autocomplete="on"><br>
           			    </div>

                        <div class="buttons2">
                		    <button id="btn_log_in">Submit</button>
                		    <button id="btn_clear">Clear</button>
            		    </div>

                    </form>



                </div>
            </div>
            


        </div>


    </div>

</body>
</html>
