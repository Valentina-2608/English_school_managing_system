<!DOCTYPE HTML>
<html>
<head>
	<title>Admin page</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<div class="main1">
         <header>
			<div class="logo">
				<div class="logo_image">
					<img src="img/logo.png" alt="logo">
				</div>
				<div class="logo_text">
					English school managing system
				</div>
			</div>
            <div class="caption">Hello, admin</div>
			<div class="block_buttons">
				<button id="btn_log_out">
					<a href="#">Log out</a>
                </button>
			</div>
		</header>
        <div class="content_1">
			<div class="content_1_tabs">
				
					<input type="radio" name="tab" id="tab_1" checked>
					<label for="tab_1">Dashboard</label>
				
				
					<input type="radio" name="tab" id="tab_2">
					<label for="tab_2">Students</label>
				
				
					<input type="radio" name="tab" id="tab_3">
					<label for="tab_3">Teachers</label>
				
				
					<input type="radio" name="tab" id="tab_4">
					<label for="tab_4">Schedule</label>
				
				
					<input type="radio" name="tab" id="tab_5">
					<label for="tab_5">Courses</label>		

				<div id="admin_dashboard">Dashboard</div>
				<div id="admin_students">
					<form id="form_students">
						<h3>Information about student</h3>
						<label for="student_first_name" class="label_1">First name</label>
						<input type="text" name="student_first_name" id="student_first_name">

						<label for="student_last_name" class="label_1">Last name</label>
						<input type="text" name="student_last_name" id="student_last_name">

						<label for="student_phone" class="label_1">Phone</label>
						<input type="tel" name="student_phone" id="student_phone">

						<label for="student_group" class="label_1">Group</label>
						<input type="text" name="student_phone" id="student_group">

						<button id="add_student">Add</button>
					</form>
				</div>
				<div id="admin_teachers">
					<form id="form_teachers">
						<h3>Information about teacher</h3>
						<label class="label_1">First name</label>
						<input type="text">

						<label class="label_1">Last name</label>
						<input type="text">

						<label class="label_1">Phone</label>
						<input type="tel">

						<label class="label_1">Email</label>
						<input type="text">

						<label class="label_1">Subjects</label>
						<input type="text">

						<button id="add_teacher">Add</button>
					</form>

				</div>
				<div id="admin_schedule">Schedule</div>
				<div id="admin_courses">Courses</div>
				

			</div>
        </div>
    </div>
</body>
</html>
